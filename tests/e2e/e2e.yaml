# Config reduzida do teste ponta a ponta (servidor falso: ~10 ms de CPU por requisição).
saida: results-e2e

alvo:
  url: http://127.0.0.1:18080/cpu?ms=10
  method: GET

carga:
  taxas: [25, 50, 100, 150, 200, 300]
  duracao: 5s
  aquecimento: 2s
  repeticoes: 2
  timeout: 10s
  pausa: 1s

vm:
  ssh: local
  porta: 22

qualidade:
  p95_max_ms: 100
  sucesso_min: 0.99

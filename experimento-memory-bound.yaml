# Configuração oficial do experimento. Todos os cenários rodam com estes mesmos parâmetros.
saida: results-memory-bound  # diretório raiz dos resultados

alvo:                        # requisição enviada pelo vegeta
  url: http://localhost:8081/api/imagens/processar   # porta do host no redirecionamento do VirtualBox
  method: POST
  # body: '{"x": 1}'         # opcional; enviado com Content-Type: application/json
  # body_arquivo: corpo.json # opcional; como body, mas lido de um arquivo (relativo ao diretório onde o bench roda)
  multipart:                 # opcional (não use junto com body); enviado como multipart/form-data
    arquivos:                # campo: caminho do arquivo (relativo ao diretório onde o bench roda)
      file: img1000.jpg
    campos:                  # campo: valor em texto
      operacao: CINZA

prometheus: http://localhost:8081/actuator/prometheus   # opcional: heap/fora do heap da JVM a cada 1 s

carga:
  taxas: [1, 5, 10, 20, 30, 40, 50, 75, 100]   # req/s, iguais para todos os cenários
  duracao: 20s               # medição de cada execução
  aquecimento: 0s             # descartado; 0s pula o aquecimento
  repeticoes: 1
  timeout: 10s               # por requisição
  pausa: 20s                  # entre execuções

vm:                          # de onde ler nproc/memória/vmstat
  ssh: osboxes@localhost     # "local" = esta máquina (sem SSH)
  porta: 2222

# Each value can be overridden by the environment variable shown (see config/app.env).
server.port=${SERVER_PORT:8080}
# Request threads in Tomcat. Each /api/primes request uses one thread for its whole calculation.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

primes.min-limit=${PRIMES_MIN_LIMIT:2}
primes.max-limit=${PRIMES_MAX_LIMIT:10000000}

spring.main.banner-mode=off
